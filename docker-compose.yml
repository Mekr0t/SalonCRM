name: saloncrm

services:
  db-main:
    image: postgres:17
    environment:
      POSTGRES_DB: salon_main
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-ml:
    image: postgres:17
    environment:
      POSTGRES_DB: salon_ml
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_ML_PASSWORD:?set in .env}
    ports:
      - "5433:5432"
    volumes:
      - db-ml-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_ml"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend-main/Dockerfile
      args:
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:8000}
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Main: Host=db-main;Port=5432;Database=salon_main;Username=salon;Password=${POSTGRES_MAIN_PASSWORD}
      Internal__ApiKey: ${INTERNAL_API_KEY:?set in .env}
      Seed__DemoData: ${SEED_DEMO_DATA:-true}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__UserPassword: ${SEED_USER_PASSWORD}
      Cookie__Secure: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      db-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ml:
    build:
      context: backend-ml
    environment:
      DATABASE_URL: postgresql+psycopg://salon:${POSTGRES_ML_PASSWORD}@db-ml:5432/salon_ml
      MAIN_API_URL: ${MAIN_API_URL:-http://app:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-salon_sid}
      MODEL_DIR: ${MODEL_DIR:-/app/models}
      RISK_MEDIUM_THRESHOLD: ${RISK_MEDIUM_THRESHOLD:-0.33}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-0.66}
    ports:
      - "8000:8000"
    volumes:
      - ml-models:/app/models
    depends_on:
      db-ml:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  db-main-data:
  db-ml-data:
  ml-models:
